<div class="ttt">
  <h1>Tic&nbsp;Tac&nbsp;Toe</h1>
  <p class="who" id="who">…</p>

  <div class="stations">
    <div class="stn" id="stn-X">
      <span class="mk mX">X</span>
      <span class="occ" id="occ-X">free</span>
      <button class="join" id="join-X" type="button">Play X</button>
    </div>
    <div class="stn" id="stn-O">
      <span class="mk mO">O</span>
      <span class="occ" id="occ-O">free</span>
      <button class="join" id="join-O" type="button">Play O</button>
    </div>
  </div>

  <div class="board" id="board">
    <button class="cell" data-i="0"></button><button class="cell" data-i="1"></button><button class="cell" data-i="2"></button>
    <button class="cell" data-i="3"></button><button class="cell" data-i="4"></button><button class="cell" data-i="5"></button>
    <button class="cell" data-i="6"></button><button class="cell" data-i="7"></button><button class="cell" data-i="8"></button>
  </div>

  <p class="status" id="status">Waiting for a second participant…</p>
  <div class="seats" id="seats"></div>
  <button class="reset" id="reset">New game</button>
</div>

<script>
/*
 * TicTacToe — entirely scripted, standalone, ZERO LLM at runtime.
 * The board IS the shared state machine: shared/ttt/{cells,turn,seats,winner}.
 * Every client runs this identical logic; the server is the single source of truth.
 */
(function () {
  var ME = (Argus.identity() || {}).userId || 'anon';
  var MYNAME = (Argus.identity() || {}).userName || ME;
  var WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var MARKS = ['X', 'O'];

  var boardEl = document.getElementById('board');
  var cells = [].slice.call(boardEl.querySelectorAll('.cell'));

  function S() { return Argus.state('shared/ttt') || {}; }
  function cellsOf(s) { return s.cells || {}; }

  /*
   * A SEAT IS A SINGLE-OCCUPANCY STATION, AND THE LOCK OWNER *IS* THE OCCUPANT.
   *
   * There is no seat VALUE to write and therefore no claim to race. Joining is taking the store
   * lock on shared/ttt/seats/<mark>; Argus.lockOwner of that path answers "who is sitting here".
   * Two people pressing Play X in the same instant cannot both win -- the server applies the first
   * lock and REFUSES the second (app/state.mjs), so single occupancy is enforced where it is
   * decided rather than merely displayed. Leaving is unlock, which only the holder may do.
   *
   * This replaces auto-seating, which took the first two arrivals whether they wanted to play or
   * not and gave an observer no way in.
   */
  function seatPath(m) { return 'shared/ttt/seats/' + m; }
  function occupant(m) { return Argus.lockOwner(seatPath(m)); }
  function nameOf(id) { return id ? (Argus.state('shared/ttt/names/' + id) || id) : null; }
  function mark() { return occupant('X') === ME ? 'X' : occupant('O') === ME ? 'O' : null; }

  /* Publish my display name under MY OWN key -- uncontended, so it can never race. */
  function publishName() {
    if (Argus.state('shared/ttt/names/' + ME) !== MYNAME) Argus.op('shared/ttt/names/' + ME, 'set', MYNAME);
  }
  function join(m) {
    if (occupant(m) || mark()) return;          // taken, or I am already seated
    publishName();
    Argus.op(seatPath(m), 'lock', {});          // the SERVER decides who actually gets it
  }
  function leave(m) { if (occupant(m) === ME) Argus.op(seatPath(m), 'unlock', null); }

  function winner(c) {
    for (var i = 0; i < WINS.length; i++) {
      var w = WINS[i];
      if (c[w[0]] && c[w[0]] === c[w[1]] && c[w[1]] === c[w[2]]) return { mark: c[w[0]], line: w };
    }
    var n = 0; for (var k in c) if (c[k]) n++;
    return n === 9 ? { mark: 'draw', line: [] } : null;
  }

  function render() {
    var s = S(), c = cellsOf(s), my = mark();
    var w = s.winner || null;
    var turn = s.turn || 'X';
    var bothSeated = !!occupant('X') && !!occupant('O');

    for (var i = 0; i < 9; i++) {
      var v = c[i] || '';
      cells[i].textContent = v;
      cells[i].className = 'cell' + (v ? ' taken m' + v : '') +
        (w && w.line && w.line.indexOf(i) >= 0 ? ' win' : '');
      cells[i].disabled = !!v || !!w || !my || !bothSeated || turn !== my;
    }

    document.getElementById('who').textContent = my
      ? 'You are ' + MYNAME + ' \u2014 ' + my
      : 'You are ' + MYNAME + ' \u2014 observing';
    document.getElementById('who').className = 'who' + (my ? ' seated' : ' observer');

    /* The station strip: who is sitting, and the one control that changes it. */
    for (var si = 0; si < MARKS.length; si++) {
      var m = MARKS[si], o = occupant(m), mine = o === ME;
      var occEl = document.getElementById('occ-' + m);
      occEl.textContent = o ? nameOf(o) : 'free';
      occEl.className = 'occ' + (o ? (mine ? ' mine' : ' taken') : '');
      var b = document.getElementById('join-' + m);
      b.textContent = mine ? 'Leave' : 'Play ' + m;
      b.disabled = (!!o && !mine) || (!o && !!my);   // held by someone else, or I sit elsewhere
      document.getElementById('stn-' + m).className = 'stn' + (mine ? ' mine' : (o ? ' taken' : ''));
    }

    var status;
    if (w) status = w.mark === 'draw' ? 'Draw.' : (w.mark + ' wins.');
    else if (!bothSeated) status = 'Waiting for both seats to be taken\u2026';
    else status = (turn === my ? 'Your move (' + turn + ')' : turn + ' to move');
    document.getElementById('status').textContent = status;
    document.getElementById('status').className = 'status' + (w ? ' done' : '');
    document.getElementById('seats').textContent = '';
    document.body.setAttribute('data-turn', w ? 'done' : turn);
  }

  boardEl.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.cell') : null;
    if (!b || b.disabled) return;
    var i = b.getAttribute('data-i');
    var s = S(), my = mark();
    if (!my || (s.turn || 'X') !== my || (cellsOf(s)[i]) || s.winner) return;

    Argus.op('shared/ttt/cells/' + i, 'set', my);
    Argus.op('shared/ttt/turn', 'set', my === 'X' ? 'O' : 'X');

    var next = {}; for (var k in cellsOf(s)) next[k] = cellsOf(s)[k]; next[i] = my;
    var w = winner(next);
    if (w) Argus.op('shared/ttt/winner', 'set', w);
  });

  for (var mi = 0; mi < MARKS.length; mi++) {
    (function (m) {
      document.getElementById('join-' + m).addEventListener('click', function () {
        if (occupant(m) === ME) leave(m); else join(m);
      });
    })(MARKS[mi]);
  }

  document.getElementById('reset').addEventListener('click', function () {
    Argus.op('shared/ttt/cells', 'clear');
    Argus.op('shared/ttt/winner', 'set', null);
    Argus.op('shared/ttt/turn', 'set', 'X');
    /* seats are NOT released -- a new game keeps the same two people at the table. */
  });

  window.addEventListener('argus-presenter:state', render);
  render();
})();
</script>

<style>
  body { font: 15px/1.5 system-ui, -apple-system, sans-serif; margin:0; padding:20px;
         background:#0e1014; color:#e9eaee; transition: background .25s; }
  body[data-turn="X"] { background:#0e1014; }
  body[data-turn="O"] { background:#12100e; }
  body[data-turn="done"] { background:#0d1512; }
  .ttt { max-width: 380px; margin: 0 auto; text-align:center; }
  h1 { font-size: 20px; letter-spacing:.02em; margin:0 0 2px; }
  .who { font-size:12.5px; margin:0 0 16px; color:#7e828d; }
  .who.seated { color:#7fd1a6; }
  .board { display:grid; grid-template-columns: repeat(3, 92px); grid-gap:8px; justify-content:center; }
  .cell { width:92px; height:92px; font-size:44px; font-weight:600; line-height:1;
          background:#181b22; color:#e9eaee; border:1px solid #262a33; border-radius:10px;
          cursor:pointer; transition: background .12s, transform .08s; font-family:inherit; }
  .cell:hover:not(:disabled) { background:#1f232c; }
  .cell:active:not(:disabled) { transform: scale(.97); }
  .cell:disabled { cursor:default; }
  .cell.mX { color:#6fb2ff; } .cell.mO { color:#ffb36f; }
  .cell.win { background:#1c3328; border-color:#2f6b4d; }
  .stations { display:flex; gap:8px; justify-content:center; margin:0 0 16px; }
  .stn { display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid #262a33;
         border-radius:8px; background:#141821; min-width:150px; }
  .stn.mine { border-color:#2f6b4d; background:#14211b; }
  .stn.taken { opacity:.72; }
  .mk { font:700 17px/1 ui-monospace,monospace; width:16px; text-align:center; }
  .mk.mX { color:#6fb2ff; } .mk.mO { color:#ffb36f; }
  .occ { flex:1; text-align:left; font-size:12px; color:#6b7280; overflow:hidden;
         text-overflow:ellipsis; white-space:nowrap; }
  .occ.mine { color:#7fd1a6; } .occ.taken { color:#b6bcc7; }
  .join { background:#1b2029; color:#dfe2e8; border:1px solid #333a45; border-radius:6px;
          padding:4px 10px; font:12px inherit; cursor:pointer; }
  .join:hover:not(:disabled) { border-color:#4a5260; }
  .join:disabled { opacity:.35; cursor:not-allowed; }
  .status { margin:16px 0 4px; font-size:15px; min-height:22px; }
  .status.done { color:#7fd1a6; font-weight:600; }
  .seats { font: 12px/1.4 ui-monospace, monospace; color:#666b76; margin-bottom:14px; }
  .reset { background:transparent; color:#8b909b; border:1px solid #2a2f39; border-radius:7px;
           padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit; }
  .reset:hover { color:#e9eaee; border-color:#414855; }
</style>
