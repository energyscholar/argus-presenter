<!doctype html>
<html lang="en" data-theme="argus">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus Presenter</title>
<!-- Plan 0471 L3: inline data-URI favicon so /favicon.ico no longer 404s (one console error per page). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0f14'/%3E%3Ccircle cx='8' cy='8' r='4' fill='none' stroke='%2322e5a0' stroke-width='1.5'/%3E%3Ccircle cx='8' cy='8' r='1.5' fill='%2322e5a0'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#0a0a1a;color:#cfe9ff;font-family:'Courier New',monospace;overflow:hidden;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;transform:scale(var(--ap-scale,1));transform-origin:center center;filter:var(--ap-filter,none);transition:transform .12s ease;}
  #frame{border:0;width:100%;height:100%;background:transparent;}
  #idle{opacity:.55;letter-spacing:.2em;font-size:.8rem;text-transform:uppercase;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
  #idle .ap-idle-brand{max-width:min(90vw,900px);max-height:90vh;width:auto;height:auto;}
  /* green connectivity dot is now a Settings button (larger hit target wraps the small dot) */
  #led-btn{position:fixed;top:4px;right:6px;z-index:60;background:none;border:0;padding:8px;cursor:pointer;line-height:0;border-radius:8px;}
  #led-btn:hover{background:rgba(255,255,255,.06);}
  #led{display:block;width:10px;height:10px;border-radius:50%;background:#cc3333;box-shadow:0 0 8px #cc3333;}
  /* P2.8: quick-switch to /control. Presenter-GRANTED only (welcome-gated, hidden otherwise).
     Top-LEFT corner, subtle; z 55 sits BELOW the config overlay (61) and control overlay (70). */
  /* Plan 0551 P3 — THE SIGN-IN AFFORDANCE. Ships DISPLAY:NONE and is revealed only when
     GET /api/auth-state says oidcActive — so a deployment with no IdP renders exactly what it
     rendered before, and a deployment WITH one is no longer a stack no human can reach (0543).

     ⚠ SIZED FOR A PHONE, deliberately: a phone is where the missing feature was found. 44px min
     tap target (the platform minimum), 13px text — NOT the 11px ambient chrome around it, which
     is a readout you glance at rather than a control you must hit while standing up. It sits
     top-right, LEFT of the settings dot (#led-btn, right:6px z60), because the one control a
     not-yet-signed-in person needs must not be three taps inside an overlay. */
  #ap-signin{position:fixed;top:4px;right:40px;z-index:56;display:none;align-items:center;gap:6px;
    min-height:44px;padding:6px 12px;background:rgba(6,10,24,.86);color:#cfe9ff;border:1px solid #2a3a5a;
    border-radius:8px;font:13px/1.3 'Courier New',monospace;letter-spacing:.04em;cursor:pointer;text-decoration:none;}
  #ap-signin.show{display:inline-flex;}
  #ap-signin:hover,#ap-signin:focus{border-color:#22e5a0;color:#fff;outline:none;}
  #ap-signin.in{cursor:default;opacity:.9;}
  #ap-signin a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:32px;}
  #ap-signin .who{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #ap-signin .out{color:#8ab;border-left:1px solid #2a3a5a;padding-left:8px;min-height:32px;display:inline-flex;align-items:center;text-decoration:none;}
  #ap-signin .out:hover{color:#f97;}
  @media (max-width:520px){ #ap-signin{font-size:14px;} #ap-signin .who{max-width:44vw;} }
  #ap-goto-control{position:fixed;top:4px;left:6px;z-index:55;background:rgba(6,10,24,.7);color:#cfe9ff;border:1px solid #2a3a5a;border-radius:6px;padding:4px 9px;font:11px/1.4 'Courier New',monospace;letter-spacing:.06em;cursor:pointer;opacity:.45;}
  #ap-goto-control:hover{opacity:1;border-color:#22e5a0;}
  /* Plan 0522 P13 — AMBIENT SEAT IDENTITY. Which seat this display is sitting at used to be
     legible ONLY inside the config panel, so a player had to open Settings to find out. This
     paints it on the main display instead.
     Top-LEFT but BELOW the ⧉ Control slot (top:4px), because a granted presenter has both and
     two fixed boxes in one corner is a collision, not a layout. z 54 sits under that button (55)
     and under every overlay. Ships hidden: a deployment whose plugins declare no stations sees
     no change whatsoever. pointer-events:none — it is a readout, never a target. */
  #ap-seat{position:fixed;top:30px;left:6px;z-index:54;display:flex;align-items:baseline;gap:7px;
    max-width:40vw;background:rgba(6,10,24,.72);border:1px solid #2a3a5a;border-radius:6px;
    padding:4px 10px;font:13px/1.4 'Courier New',monospace;letter-spacing:.06em;pointer-events:none;}
  #ap-seat-k{color:#8ab;font-size:10px;letter-spacing:.14em;text-transform:uppercase;}
  #ap-seat-v{color:#eafff6;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Plan 0534 W4c — AMBIENT PEEK STATE. A peek puts a declared surface on ONE viewer's screen and
     nothing else on the page distinguishes that from what the room is showing. This says so, on
     the display itself rather than inside Settings, and it is also the way back: click it and you
     return to the room's screen. AMBER, deliberately unlike the calm seat badge — "you are off on
     your own" is a state worth noticing. Top-CENTRE because both top corners are already spoken
     for (⧉ Control, the seat badge, the settings dot); slim, and z 56 sits under the chime pill
     (z 80, margin-top 18px) so a bell still reads over it.
     ⚠ CENTRED WITH left:0;right:0;margin:0 auto, NOT with left:50% + translateX. An absolutely
     positioned shrink-to-fit box gets its available width from the OFFSETS, so left:50% leaves it
     half the viewport — at 800x600 that wrapped the badge onto two lines and ellipsised the one
     word that matters (the surface's name) while the boilerplate kept its space. Seen in a
     screenshot at 800x600, not reasoned about. The hint truncates FIRST (flex:1 1 auto on -x,
     nothing on -v), so the label is the last thing to go. */
  #ap-peek{position:fixed;top:0;left:0;right:0;margin:0 auto;width:fit-content;max-width:94vw;
    z-index:56;display:none;align-items:baseline;gap:9px;flex-wrap:nowrap;
    background:rgba(44,29,4,.95);border:1px solid #f7c948;
    border-top:0;border-radius:0 0 8px 8px;padding:3px 13px;font:12px/1.5 'Courier New',monospace;
    letter-spacing:.06em;color:#f7c948;cursor:pointer;}
  #ap-peek.show{display:flex;}
  /* Plan 0537 P1.4 — the badge is position:fixed at top:0 and #stage is inset:0, so while a peek
     is up the badge SITS ON the first ~25px of the peeked surface. On the air/raft that is
     exactly seat 1's row: the one screen you summoned to read, with its first line covered by
     the label telling you that you summoned it. Yield the strip instead of floating over it —
     the stage starts BELOW the badge for as long as (and only while) the badge is shown.
     Sibling selector, not a JS toggle: #ap-peek precedes #stage in the body and .show is already
     the single source of truth for "a peek is up", so there is no second state to keep in sync. */
  #ap-peek.show ~ #stage{top:28px;}
  #ap-peek:hover{background:rgba(66,44,8,.98);border-color:#ffe9a8;}
  #ap-peek-k{flex:0 0 auto;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;white-space:nowrap;}
  #ap-peek-v{flex:0 1 auto;color:#ffe9a8;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #ap-peek-x{flex:1 1 auto;min-width:0;font-size:10px;letter-spacing:.1em;opacity:.7;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #led.on{background:#22e5a0;box-shadow:0 0 8px #22e5a0;}
  /* max-height: the panel is position:fixed with no intrinsic bound — as rows accumulate it
     grew down across the echo line (#ap-echo, bottom:38px) and the input row, which it
     outranks at z-index 61 vs 41. Bound it to stop ABOVE that strip and scroll its own
     overflow instead of overlaying the display. Top 34px + 72px bottom clearance. */
  #ap-config{position:fixed;top:34px;right:8px;z-index:61;width:236px;max-height:calc(100vh - 106px);overflow-y:auto;overscroll-behavior:contain;background:rgba(6,10,24,.96);border:1px solid #2a3a5a;border-radius:8px;padding:10px 12px;font:12px/1.4 'Courier New',monospace;color:#cfe9ff;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5);}
  #ap-config.open{display:block;}
  #ap-config h4{margin:0 0 6px;font-size:11px;letter-spacing:.12em;color:#6cf;text-transform:uppercase;}
  #ap-config .row{display:flex;gap:4px;align-items:center;margin:5px 0;flex-wrap:wrap;}
  #ap-config button{background:#12234a;color:#cfe9ff;border:1px solid #2a3a5a;border-radius:5px;padding:3px 7px;font:inherit;cursor:pointer;}
  #ap-config button:hover{border-color:#22e5a0;}
  #ap-config button.sel{border-color:#22e5a0;color:#fff;}
  /* W4c: a bare <select> renders in the browser's own chrome — bright white in a panel whose every
     other control is dark. The station selector has always looked like that; the surface picker
     sits two rows from ▣ My station screen and must not look like a different application, so the
     rule is on `select` and both now match the buttons. Appearance only. */
  #ap-config select{background:#12234a;color:#cfe9ff;border:1px solid #2a3a5a;border-radius:5px;padding:3px 6px;font:inherit;cursor:pointer;max-width:100%;}
  #ap-config select:hover{border-color:#22e5a0;}
  #ap-config input{background:#0d1633;color:#cfe9ff;border:1px solid #2a3a5a;border-radius:5px;padding:3px 6px;font:inherit;flex:1 1 90px;min-width:80px;}
  #ap-config #cfg-role-msg{color:#f97;font-size:11px;flex-basis:100%;margin:0;}
  #ap-config .k{color:#8ab;}
  #ap-config .rd{font-size:11px;opacity:.85;margin-top:8px;border-top:1px solid #1c2a44;padding-top:6px;}
  /* Presenter-control expand/collapse overlay (P5): full-screen iframe host for /control */
  #ap-control-overlay{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:#040814;}
  #ap-control-overlay.open{display:flex;}
  #ap-control-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:rgba(6,10,24,.96);border-bottom:1px solid #2a3a5a;font:12px/1.4 'Courier New',monospace;color:#6cf;letter-spacing:.1em;text-transform:uppercase;}
  #ap-control-bar button{background:#12234a;color:#cfe9ff;border:1px solid #2a3a5a;border-radius:5px;padding:3px 9px;font:12px/1.4 'Courier New',monospace;cursor:pointer;}
  #ap-control-bar button:hover{border-color:#22e5a0;}
  #ap-control-frame{flex:1;width:100%;border:0;background:#040814;}
  #who{position:fixed;bottom:8px;left:12px;font-size:.65rem;opacity:.4;letter-spacing:.1em;}
  /* ── Plan 0537 P4.1 — THE REPLY CHANNEL MOVES TO THE RIGHT EDGE ─────────────────────────────
     Bruce, S229: "we did have it as just the green dot, no other always-present controls. Clean."
     The bottom bar was 4 of the 8 always-present elements and 44px of permanent full-width
     furniture, paid by every participant in every session including the ones who never type.
     The reply channel still EARNS permanence (docs/display-chrome-budget.md: "a participant with
     nothing to say back is an audience") — so what stays is the smallest thing that keeps that
     promise: a slim edge tab. The input itself is SUMMONED.
     ⛓ Collapsed state is `visibility:hidden`, not an off-screen transform alone: a box parked
     outside the viewport is still laid out, still tabbable, and still counts as chrome by any
     honest inventory. Hiding it means hiding it. */
  #ap-chat-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:41;
    padding:12px 4px;background:rgba(6,10,24,.85);color:#8fd6ff;border:1px solid #1c2a44;border-right:0;
    border-radius:8px 0 0 8px;font:11px/1 'Courier New',monospace;letter-spacing:.16em;cursor:pointer;
    writing-mode:vertical-rl;text-orientation:mixed;opacity:.55;transition:opacity .15s ease;}
  #ap-chat-tab:hover,#ap-chat-tab:focus{opacity:1;outline:none;}
  /* Plan 0539 P1.2 — WIDER AND TALLER WHEN OPEN. Bruce: "can be a bit bigger when folded out."
     ⛓ The cost of this is ZERO WHILE CLOSED, which is the entire argument for the summon pattern:
     the always-present inventory is the 20×85 tab and nothing else, so the panel can afford to be
     a real reading surface. 320 → 420 wide, and it now has a height budget instead of hugging its
     content. Re-measured after the change: still SEVEN always-present elements. */
  #ap-chat{position:fixed;right:0;top:50%;transform:translateY(-50%) translateX(102%);
    visibility:hidden;opacity:0;transition:transform .16s ease,opacity .16s ease,visibility .16s;
    display:flex;flex-direction:column;gap:6px;width:420px;max-width:88vw;max-height:82vh;padding:10px;
    background:rgba(6,10,24,.96);border:1px solid #1c2a44;border-right:0;border-radius:8px 0 0 8px;z-index:42;}
  #ap-chat.open{transform:translateY(-50%) translateX(0);visibility:visible;opacity:1;}
  #ap-chat-why{font:11px/1.4 'Courier New',monospace;color:#e0a94a;opacity:.9;}
  /* Plan 0539 P1.1 — THE READER. 0537 shipped a way to speak into a room with no way to hear it.
     Newest at the bottom, scrollback above, and the view is never yanked while someone reads up. */
  #ap-chat-log{flex:1 1 auto;min-height:140px;max-height:52vh;overflow-y:auto;overflow-x:hidden;
    font:12px/1.45 'Courier New',monospace;color:#cfe9ff;background:#080e20;border:1px solid #1c2a44;
    border-radius:6px;padding:6px 8px;overscroll-behavior:contain;word-break:break-word;}
  #ap-chat-log:focus{outline:1px solid #2a3a5a;}
  #ap-chat-log .ap-cl-empty{opacity:.5;font-style:italic;}
  #ap-chat-log .ap-cl-row{margin:0 0 5px;}
  #ap-chat-log .ap-cl-who{color:#8fd6ff;font-weight:700;}
  #ap-chat-log .ap-cl-who::after{content:": ";color:#8fd6ff;font-weight:400;}
  /* ⚠ The aside is the one line whose AUDIENCE differs from every other line in the log. It is
     marked by colour AND by a text tag — colour alone is not a message, and 1.3's requirement is
     that the sender can SEE which of their lines the room could read. */
  #ap-chat-log .ap-cl-row.aside{color:#e0a94a;border-left:2px solid #e0a94a;padding-left:6px;}
  #ap-chat-log .ap-cl-row.aside .ap-cl-who{color:#e0a94a;}
  #ap-chat-log .ap-cl-tag{font-size:10px;letter-spacing:.08em;opacity:.85;}
  #ap-chat-log .ap-cl-row.roll{color:#9fe6b8;border-left:2px solid #2f6b47;padding-left:6px;}
  #ap-chat-log .ap-cl-row.roll .ap-cl-who{color:#9fe6b8;}
  #ap-chat-log .ap-cl-row.mine .ap-cl-who{text-decoration:underline;}
  /* Plan 0476 P4: echo line — one line of the speaker's own recognized words. It sat at bottom:38px
     to clear the old input row; with that row gone it drops to the floor, clearing only #who. */
  #ap-echo{position:fixed;bottom:6px;left:0;right:0;padding:3px 10px 3px 180px;z-index:41;font:12px/1.35 'Courier New',monospace;color:#8fd6ff;background:linear-gradient(rgba(6,10,24,0),rgba(6,10,24,.72));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .18s ease;pointer-events:none;}
  #ap-echo.show{opacity:.92;}
  #ap-chat input{flex:1 1 auto;background:#0d1633;color:#cfe9ff;border:1px solid #2a3a5a;border-radius:6px;padding:5px 8px;font:inherit;}
  #ap-chat input:disabled{opacity:.5;}
  #ap-chat button{background:#12234a;color:#cfe9ff;border:1px solid #2a3a5a;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;}
  #ap-chat button:disabled{opacity:.5;cursor:default;}
  #ap-debug{position:fixed;top:26px;right:12px;width:340px;max-height:70vh;overflow:auto;background:rgba(6,10,24,.92);
    border:1px solid #2a3a5a;border-radius:6px;padding:8px 10px;font:11px/1.35 'Courier New',monospace;color:#9fd;z-index:50;}
  #ap-debug h4{margin:0 0 4px;font-size:11px;letter-spacing:.12em;color:#6cf;text-transform:uppercase;}
  #ap-debug .k{color:#8ab;}
  #ap-debug pre{margin:4px 0;white-space:pre-wrap;word-break:break-word;color:#cfe9ff;}
  #ap-debug .msg{border-top:1px solid #1c2a44;opacity:.85;}
  /* CHIME banner (MCP presenter_bell / presenter_verify_watching): gentle top-center pill so
     a backgrounded tab, once brought forward, shows why it dinged. Auto-clears on focus or click. */
  #ap-ready{position:fixed;top:0;left:0;right:0;z-index:80;display:none;justify-content:center;pointer-events:none;}
  #ap-ready.show{display:flex;}
  #ap-ready .pill{margin-top:18px;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:12px;
    background:rgba(8,14,30,.96);border:1px solid #22e5a0;border-radius:12px;padding:12px 20px;
    box-shadow:0 6px 28px rgba(0,0,0,.55),0 0 20px rgba(34,229,160,.25);
    font:14px/1.4 'Courier New',monospace;color:#cfe9ff;letter-spacing:.04em;animation:ap-ready-in .3s ease;}
  #ap-ready .bell{font-size:20px;animation:ap-ready-ring 1.1s ease infinite;}
  #ap-ready .msg{font-weight:bold;color:#eafff6;}
  #ap-ready .sub{opacity:.6;font-size:12px;}
  #ap-ready .ap-ack{margin-left:6px;pointer-events:auto;cursor:pointer;background:#12341f;color:#8ef0a0;
    border:1px solid #22e5a0;border-radius:8px;padding:7px 14px;font:bold 13px/1 'Courier New',monospace;
    letter-spacing:.04em;white-space:nowrap;}
  #ap-ready .ap-ack:hover{background:#164a2a;color:#eafff6;}
  @keyframes ap-ready-in{from{transform:translateY(-14px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes ap-ready-ring{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(14deg)}80%{transform:rotate(-10deg)}90%{transform:rotate(6deg)}}
  /* ATT (Plan 0466): attendance overlay — a big clean read-only roster (participant view: dots). */
  #ap-attendance{position:fixed;inset:6vh 8vw;z-index:82;background:rgba(6,10,24,.98);border:1px solid #2a3a5a;border-radius:12px;
    display:none;flex-direction:column;box-shadow:0 12px 44px rgba(0,0,0,.6);font:13px/1.5 'Courier New',monospace;color:#cfe9ff;}
  #ap-attendance.open{display:flex;}
  #att-bar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #21314f;}
  #att-bar span{font-size:15px;font-weight:bold;letter-spacing:.06em;}
  #att-bar button{margin-left:auto;background:#12234a;color:#cfe9ff;border:1px solid #2a3a5a;border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer;}
  #att-bar button:hover{border-color:#22e5a0;}
  #att-list{flex:1 1 auto;overflow:auto;padding:12px 18px;}
  #att-list .att-row{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid #12203a;}
  #att-list .att-name{font-weight:bold;color:#eafff6;}
  #att-list .att-role{font-size:11px;color:#8ab;border:1px solid #2a3a5a;border-radius:8px;padding:0 6px;}
  #att-summary{padding:10px 18px;border-top:1px solid #21314f;font-size:12px;color:#8ab;}
  .att-dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
</style>
</head>
<body>
<button id="led-btn" title="Settings" aria-haspopup="true" aria-label="Connection and settings"><span id="led"></span></button>
<button id="ap-goto-control" title="Open (or refocus) the presenter control window" style="display:none">⧉ Control</button>
<!-- Plan 0551 P3 — SIGN IN. Ships hidden; revealed ONLY when GET /api/auth-state reports
     oidcActive. Plain <a href> targets, not fetch(): the OAuth flow is a full-page redirect, and a
     link that works with the script broken is the right shape for the one control that gets a
     person out of the fenced default. ⛔ Nothing here ever holds an email, a `sub`, or a session
     id — the display name is all the endpoint hands over, and only to its own holder. -->
<div id="ap-signin" role="status" aria-live="polite">
  <a id="ap-signin-link" href="/auth/login" title="Sign in with your account to speak as yourself">🔑 Sign in</a>
  <span id="ap-signin-who" class="who" style="display:none"></span>
  <a id="ap-signin-out" class="out" href="/auth/logout" title="Sign out" style="display:none">sign out</a>
</div>
<!-- Plan 0522 P13 — the seat's own identity, ambient. Ships hidden and is revealed only by a
     welcome carrying a non-empty registry (the same gate as the selector row above it), so a
     deployment with no stations renders nothing at all. Every string in it comes from the
     registry at runtime; core knows no label of its own. -->
<div id="ap-seat" role="status" aria-live="polite" style="display:none"><span id="ap-seat-k"></span><span id="ap-seat-v"></span></div>
<!-- Plan 0534 W4c — the peek badge. Ships hidden; shown only while this viewer is on a surface
     they called up themselves, and clickable to go back. Every word here is core's own: the
     registry supplies the LABEL and nothing else. -->
<div id="ap-peek" role="status" aria-live="polite" title="You called this screen up yourself. Click to go back to what the room is showing."><span id="ap-peek-k">▤ You are looking at</span><span id="ap-peek-v"></span><span id="ap-peek-x">only you see this · click to go back</span></div>
<div id="ap-config" role="dialog" aria-label="Settings">
  <!-- Plan 0514 §7 — the panel was getting cluttered, so it is GROUPED: You · Your screen ·
       Display · Presenter. The old row labelled "Role (User/Presenter)" is the PRIVILEGE axis
       (userRole) and is now labelled "Access", because adding a second thing called Role to the
       same panel is exactly the collision naming canon §6 forbids. -->
  <h4>You</h4>
  <!-- The station selector is HIDDEN unless a plugin declares stations, so a deployment with no
       stations (e.g. teaching) sees no change whatsoever. -->
  <div class="row" id="cfg-station-row" style="display:none"><span class="k" id="cfg-station-label">Station</span> <select id="cfg-station-select"></select></div>
  <div class="row" id="cfg-name-row" style="display:none"><span class="k">Name</span> <span id="cfg-name"></span></div>
  <h4>Your screen</h4>
  <!-- Plan 0508 — STATION SCREEN. "My station" is self-scoped and always available.
       Plan 0514 §13.4: it now means "show MY STATION", which is what the button says — the source
       is the seat's station, not the last thing pushed to the seat.
       "Share" is default-hidden and appears only when a controller grants this seat the spotlight —
       it promotes your own station view to everyone so you can talk the table through it. -->
  <div class="row"><button id="cfg-station" title="Show your own station screen. Only you see this.">▣ My station screen</button></div>
  <div class="row" id="cfg-share-row" style="display:none"><button id="cfg-station-share" title="Put YOUR station screen on everyone's display so you can explain it.">◉ Share my screen with everyone</button></div>

<!-- ATT (Plan 0466 §2.7, reworked Plan 0468): attendance overlay — participant render = names · role ·
     connection-liveness dot (🟢 connected / 🔴 offline) + 👁 when confirmed watching. Read-only "who's in
     the room". Hidden until opened; request/reply. -->
<div id="ap-attendance" role="dialog" aria-label="Attendance">

<div id="ap-ready" aria-live="polite"><div class="pill" role="status"><span class="bell">🔔</span><span><span class="msg">Ready to start?</span> <span class="sub">— bring me forward, then tell me to go.</span></span><button class="ap-ack" type="button" style="display:none">✓ I'm watching</button></div></div>

<div id="who"></div>

<!-- Plan 0537 P4.1 — the tab is the ONLY always-present part of the reply channel; the panel it
     opens is summoned. P4.2 — #ap-chat-why says WHY the input is off, in words a facilitator can
     act on: "disabled until a listener is attached" describes the code's condition, not the human
     one, and Bruce read it as "not yet built". -->
<button id="ap-chat-tab" type="button" aria-controls="ap-chat" aria-expanded="false" title="Open the message panel">MESSAGE</button>
<!-- Plan 0539 P1.1 — the LOG is the first child, so the room's talk sits ABOVE the box you talk
     into, which is where every other messaging surface in the world puts it. -->
<div id="ap-chat"><div id="ap-chat-log" role="log" aria-live="polite" aria-label="messages" tabindex="0"></div><div id="ap-chat-why"></div><input id="ap-chat-input" disabled placeholder="type a message…"><button id="ap-chat-send" disabled>Send</button></div>
<!-- Plan 0539 P1.7 — the shared, domain-neutral "show the arithmetic" renderer. ⛔ Loaded OUTSIDE
     the voice fence below: it is not voice, and the server deletes that whole region when voice is
     off (which is the default). A handler written inside it is stripped from every ordinary
     deployment — the exact trap recorded on the chat_private branch. -->
<script src="/lib/breakdown.js"></script>
<!-- AP-VOICE:BEGIN -->
<!-- Plan 0470 Tier 0: the ONLY voice code loaded by default (~sub-1KB). It does nothing until
     enable(), which dynamic-imports the Tier-1 capture engine on demand (T-LAZY).
     Plan 0473 P0: this <script> is STRIPPED server-side when PRESENTER_VOICE_ENABLED is off,
     so the audience page pulls ZERO voice bytes and runs no always-on voice runtime. -->
<script src="/lib/voice-stub.js"></script>
<!-- AP-VOICE:END -->
<script>
(function(){
  var NS = 'argus-presenter';
  var q = new URLSearchParams(location.search);
  // Role precedence: explicit URL ?role= wins; else a role the viewer chose earlier
  // (persisted in localStorage via the Config overlay); else default participant.
  var ROLE_KEY = NS + ':role';
  var savedRole = null;
  try { savedRole = localStorage.getItem(ROLE_KEY); } catch(e){}
  // Plan 0514 §5 / §5.1 — SEAT PROVISIONING, BY UID.
  //   ?stationUID=4   the SELECTOR. An integer looked up in the registry server-side.
  //   ?station=…      COSMETIC ONLY. Its VALUE is never read or matched — that is what stops it
  //                   becoming load-bearing again. Its mere PRESENCE only marks the link as
  //                   addressed to a seat, so a uid-less link still derives a stable
  //                   <defaultCode>-<name> identity instead of a fresh random one per reload.
  // Absent, non-numeric or unknown ⇒ the deployment's default station, silently, never an error.
  // `?role=` means ONLY the privilege axis (naming canon §1); it is not a station alias.
  var uidParam = q.get('stationUID');
  var stationUID = (uidParam != null && uidParam !== '' && /^-?\d+$/.test(uidParam)) ? parseInt(uidParam, 10) : null;
  var seatLinked = uidParam != null || q.get('station') != null;   // this link is addressed to a seat
  var nameParam = q.get('name') || q.get('n');
  var identity = {
    userId: q.get('userId') || q.get('u') || ('anon-' + Math.random().toString(36).slice(2,8)),
    // A seat link with no name shows as NAME UNKNOWN, literally and never blank (§5). Without a
    // seat link the long-standing 'Guest' default is unchanged.
    userName: nameParam || (seatLinked ? '' : 'Guest'),
    // Always sent (null when the link carries none) so the server resolves the seat rather than
    // falling back to the anonymous identity path.
    stationUID: seatLinked ? stationUID : undefined,
    role: q.get('role') || savedRole || 'participant',
    // Token pass-through: when a PRESENTER_CONTROL_TOKEN is configured server-side,
    // ?token=… in the URL satisfies the AUTH-1 gate for a control role. Default: none (open).
    token: q.get('token') || null,
    // Plan 0472 P4: a permissioned GUEST capability link (?cap=<signed token>). Pass it through on the
    // hello; the server verifies the HMAC + expiry + revocation and grants a scoped guest identity
    // (participant only). No client-side trust — the client just forwards the bearer token.
    cap: q.get('cap') || null
  };
  function renderWho(){ document.getElementById('who').textContent = identity.role + ' · ' + identity.userName + ' (' + identity.userId + ')'; }
  renderWho();

  // AUTH-ROLE (P5.5): is the presenter role password-gated, and what public salt does the
  // browser hash with? Default UNGATED on fetch failure. The Role picker (below) reads these.
  var authGated = false, authSeed = 'argus-presenter';
  fetch('/api/auth').then(function(r){ return r.json(); })
    .then(function(d){ authGated = !!(d && d.gated); if (d && d.seed) authSeed = d.seed; })
    .catch(function(){ authGated = false; });
  // Set by the Role picker; called from the `welcome` handler with the server's EFFECTIVE
  // granted role so a silent downgrade (wrong password) surfaces as feedback.
  var onWelcomeRole = null;

  /* ── Plan 0551 P3 — THE SIGN-IN AFFORDANCE ──────────────────────────────────────────────────
   * 0543 shipped routes, an adapter, an allowlist and a trust path, and Bruce opened the
   * Presenter on his phone and found NO WAY IN. Nothing in any client linked /auth/login.
   *
   * ⛔ VISIBLE ONLY WHEN THE SERVER SAYS SIGN-IN EXISTS. A button that 404s is worse than no
   * button, so the reveal is gated on oidcActive from GET /api/auth-state — never assumed, never
   * hard-coded. Absent/failed fetch ⇒ stays hidden (the pre-0551 page, exactly).
   *
   * The state it renders is deliberately three-valued, because "signed in" and "authorized" are
   * different things and the fence makes the difference matter: signed OUT (offer the link),
   * signed in and ALLOWLISTED (say so), signed in and NOT allowlisted (say THAT, out loud —
   * otherwise a person discovers it only when their words arrive fenced). */
  var authStateLast = null;
  function renderSignIn(st){
    authStateLast = st || null;
    var pill = document.getElementById('ap-signin');
    var link = document.getElementById('ap-signin-link');
    var who = document.getElementById('ap-signin-who');
    var out = document.getElementById('ap-signin-out');
    var row = document.getElementById('cfg-signin-row');
    var acts = document.getElementById('cfg-signin-actions');
    var cst = document.getElementById('cfg-signin-state');
    var cin = document.getElementById('cfg-signin-link');
    var cout = document.getElementById('cfg-signout-link');
    var active = !!(st && st.oidcActive);
    if (pill) pill.classList.toggle('show', active);
    if (row) row.style.display = active ? '' : 'none';
    if (acts) acts.style.display = active ? '' : 'none';
    if (!active) return;
    var signedIn = !!(st && st.signedIn);
    // ⛔ st.name is the ONLY identifier the endpoint hands over, and only to its own holder. There
    // is no email and no `sub` in this payload to render even by accident.
    var label = (st && st.name) ? st.name : 'signed in';
    if (pill) pill.classList.toggle('in', signedIn);
    if (link) link.style.display = signedIn ? 'none' : '';
    if (who) { who.style.display = signedIn ? '' : 'none'; who.textContent = (st && st.trust === 'self') ? ('✓ ' + label) : ('◌ ' + label); }
    if (out) out.style.display = signedIn ? '' : 'none';
    if (cin) cin.style.display = signedIn ? 'none' : '';
    if (cout) cout.style.display = signedIn ? '' : 'none';
    if (cst) {
      cst.textContent = !signedIn ? 'not signed in'
        : (st.trust === 'self' ? (label + ' · authorized')
          : (label + ' · signed in, NOT authorized' + (st.reauth ? ' (session expired — sign in again)' : '')));
      cst.style.color = !signedIn ? '#8ab' : (st.trust === 'self' ? '#8fe6a8' : '#f97');
    }
    if (pill) pill.title = !signedIn ? 'Sign in with your account to speak as yourself'
      : (st.trust === 'self' ? (label + ' — signed in and authorized') : (label + ' — signed in, but not on this room\'s allowlist'));
  }
  function refreshAuthState(){
    return fetch('/api/auth-state', { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(st){ renderSignIn(st); return st; })
      .catch(function(){ renderSignIn(null); return null; });   // unreachable ⇒ hidden, i.e. the pre-0551 page
  }
  refreshAuthState();

  // ---- P2.8: quick-switch button to /control (reciprocal of control.html's #btn-present).
  // Visibility is gated on the EFFECTIVE role the server granted in `welcome`, NOT the
  // requested one: a silent downgrade (wrong/absent credential) must hide the button.
  // identity.role is ALSO required so switching to User hides it immediately (pre-reconnect).
  var grantedRole = null;   // last welcome-echoed role; null until a welcome arrives
  function updateGotoControl(){
    var b = document.getElementById('ap-goto-control');
    if (b) b.style.display = (grantedRole === 'presenter' && identity.role === 'presenter') ? '' : 'none';
  }
  document.getElementById('ap-goto-control').addEventListener('click', function(){
    // Reuse THIS page's credential (identity.token: URL param or role-picker hash); never hardcode.
    var url = '/control?role=presenter';
    if (identity.token) url += '&token=' + encodeURIComponent(identity.token);
    // NAMED target: two-way pair with control.html's 'presenter-display' — reopening
    // FOCUSES the same window instead of spawning duplicates.
    var w = window.open(url, 'presenter-control');
    if (w) { try { w.focus(); } catch(e){} }
  });

  var stage = document.getElementById('stage');
  var led = document.getElementById('led');
  var frame = null;

  // ---- Debug overlay (?debug=1): connection, socketId, last N ops/messages, state inspector.
  var DEBUG = q.get('debug') === '1' || q.get('debug') === 'true';
  var dbg = { open: false, socketId: null, msgs: [], state: {} };
  var dbgEl = null;
  function dbgGet(path) { var o = dbg.state; (path || '').split('/').filter(Boolean).forEach(function (k) { o = (o && typeof o === 'object') ? o[k] : undefined; }); return o; }
  function dbgMerge(diff) { if (!diff || typeof diff !== 'object') return; for (var p in diff) { if (!diff.hasOwnProperty(p)) continue; var parts = p.split('/').filter(Boolean), o = dbg.state; for (var i = 0; i < parts.length - 1; i++) { if (typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; } if (parts.length) o[parts[parts.length - 1]] = diff[p]; } }
  function dbgRender() {
    if (!DEBUG) return;
    if (!dbgEl) { dbgEl = document.createElement('div'); dbgEl.id = 'ap-debug'; document.body.appendChild(dbgEl); }
    // Plan 0471 M1: HTML-escape every value before innerHTML. JSON.stringify escapes " but
    // not <>, so peer-authored state (a marker label / answer of `</pre><img onerror=…>`,
    // reachable via a diff) would otherwise execute JS in the ?debug overlay.
    var last = dbg.msgs.slice(-8).map(function (m) { return '<div class="msg"><span class="k">' + attEscape(m.t) + '</span> ' + attEscape(m.brief || '') + '</div>'; }).join('');
    dbgEl.innerHTML =
      '<h4>Argus Debug</h4>' +
      '<div><span class="k">conn</span> ' + (dbg.open ? 'open' : 'closed') + ' · <span class="k">socket</span> ' + attEscape(dbg.socketId || '—') + '</div>' +
      '<div><span class="k">role</span> ' + attEscape(identity.role) + ' · <span class="k">user</span> ' + attEscape(identity.userId) + '</div>' +
      '<h4 style="margin-top:6px">state</h4><pre>' + attEscape(JSON.stringify(dbg.state, null, 1).slice(0, 1200)) + '</pre>' +
      '<h4>last messages</h4>' + last;
  }
  function dbgLog(m) {
    if (!DEBUG) return;
    var brief = '';
    if (m.t === 'op' || m.t === 'diff') brief = JSON.stringify(m.diff || m.value || {}).slice(0, 80);
    else if (m.t === 'content') brief = (m.contentId || '') + '';
    else if (m.t === 'host') brief = (m.msg && m.msg.type) || '';
    dbg.msgs.push({ t: m.t, brief: brief });
    if (dbg.msgs.length > 40) dbg.msgs.shift();
    if (m.t === 'diff' && m.diff) dbgMerge(m.diff);
    if (m.t === 'host' && m.msg && m.msg.type === 'diff' && m.msg.diff) dbgMerge(m.msg.diff);
    if (m.t === 'snapshot' && m.state) dbg.state = m.state;
    dbgRender();
  }
  // Expose for tests / manual poking.
  window.__apDebug = { get: dbgGet, dump: function () { return dbg; } };

  var proto = location.protocol === 'https:' ? 'wss' : 'ws';
  var ws = null;
  var lastVersion = 0;            // highest state version this client has applied (X1 resync)
  var reconnectDelay = 300, reconnectTimer = null;
  function scheduleReconnect(){
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(function(){ reconnectTimer = null; connect(); }, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 5000);   // backoff (X6 storm debounce)
  }
  function connect(){
    // S206 fix: single IDEMPOTENT entry point. Cancel any pending auto-reconnect and fully detach +
    // close any prior socket BEFORE opening a new one — otherwise setRole()/unlock()/onclose can each
    // spawn a socket on top of a live/closing one, and each orphan's onclose re-triggers
    // scheduleReconnect() → the c1..c8 reconnect storm. (The voice mic auto-follows via getSocket().)
    if (reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (ws){ try { ws.onopen = ws.onclose = ws.onerror = ws.onmessage = null; ws.close(); } catch(e){} }
    ws = new WebSocket(proto + '://' + location.host);
    ws.onopen = function(){ led.classList.add('on'); dbg.open = true; dbgRender(); reconnectDelay = 300;
      ws.send(JSON.stringify(Object.assign({ t:'hello', lastVersion:lastVersion }, identity))); };
    ws.onclose = function(){ led.classList.remove('on'); dbg.open = false; dbgRender(); scheduleReconnect(); };
    ws.onerror = function(){ /* onclose handles reconnect */ };
    ws.onmessage = onMessage;
  }
  /* AP-VOICE:BEGIN */
  // Plan 0470: hand the live socket to the voice stub so Tier-1 capture shares THIS WebSocket
  // for the binary PCM lane (no second connection). getSocket() always returns the current ws.
  // Plan 0473 P0: stripped server-side when PRESENTER_VOICE_ENABLED is off.
  window.APVoiceHost = { getSocket: function(){ return ws; }, onTranscript: null };
  /* AP-VOICE:END */

  var lastSnapshot = null;   // most recent server snapshot (relayed into new content frames)
  // F1: keep lastSnapshot CURRENT by merging live diffs into it, so a late-mounted
  // component seeds from present state (e.g. poll-results pushed AFTER votes arrived
  // shows the real tally, not 0). Path-keyed diff -> nested state; null deletes.
  function mergeDiffInto(state, diff){
    if (!state || !diff) return;
    for (var pth in diff){ if (!diff.hasOwnProperty(pth)) continue;
      var parts = pth.split('/').filter(Boolean), o = state, i;
      for (i = 0; i < parts.length - 1; i++){ if (typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
      if (parts.length){ var leaf = parts[parts.length - 1]; if (diff[pth] === null){ try { delete o[leaf]; } catch(e){} } else o[leaf] = diff[pth]; }
    }
  }
  function showContent(html){
    stage.innerHTML = '';
    frame = document.createElement('iframe');
    frame.id = 'frame';
    // Sandbox: scripts run, opaque origin (no same-origin) — can postMessage out, can't touch us.
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.srcdoc = html;
    // On load, replay the current state snapshot into the new component so it
    // initialises from live state (Memento), then future diffs keep it in sync.
    frame.addEventListener('load', function(){
      if (lastSnapshot && frame && frame.contentWindow)
        frame.contentWindow.postMessage({ source:'argus-host', type:'snapshot', state:lastSnapshot.state, version:lastSnapshot.version }, '*');
    });
    stage.appendChild(frame);
  }
  function showIdle(){ stage.innerHTML = '<div id="idle"><img class="ap-idle-brand" src="/branding/argus-presenter.svg" alt="Argus Presenter — awaiting content"></div>'; frame = null; }

  function onMessage(ev){
    var m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    dbgLog(m);
    if (m.t === 'ping') { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t:'pong', ts:m.ts })); return; }   // X3 RTT
    if (m.t === 'chat_listeners') { updateChat(m.n); return; }   // P3
    if (m.t === 'chat_private') {
      // Plan 0537 P2.3 — the server's receipt for a `/gm …` aside. ⛓ THE POINT OF THIS BRANCH:
      // a private message is INDISTINGUISHABLE FROM A LOST ONE unless something says so. The room
      // will never show it (it went to the controller-only `gm` slice), so the only evidence the
      // sender gets is this line. Rendered in the echo strip — chrome ALREADY on screen, so a
      // private channel costs zero new always-present pixels.
      // ⛔ IT LIVES HERE, BESIDE `chat_listeners`, AND NOT DOWN IN THE `else if` CHAIN — that chain
      // runs from line ~430 to ~531 INSIDE THE VOICE FENCE (the BEGIN/END comment markers the
      // server greps for), and the server DELETES that whole block when voice is off, which is the
      // default. Written there first, this handler was stripped out of every ordinary deployment:
      // the server sent the receipt, the raw-socket test passed, and the actual browser rendered
      // nothing. Chat is NOT voice (see V0473-zero-when-off) and its handlers must not sit inside
      // voice's coffin. ⚠ Do not name those markers literally anywhere outside the fence itself —
      // T-BARGE-IN forbids the token from appearing in the served OFF page at all, and this very
      // comment tripped it once.
      try {
        var pe = document.getElementById('ap-echo');
        if (pe) {
          // ⚠ "facilitator", not the uppercase prose form of the role — this is USER-VISIBLE page
          // text and the 0532 neutrality guard scans it (the lowercase `/gm` command is a protocol
          // literal and is exempt). Caught by t0532-04, not by review.
          pe.textContent = m.ok ? ('🔒 sent privately to the facilitator — ' + m.text + ' (nobody else saw this)')
                                : '🔒 /gm needs something to say — type /gm then your message';
          pe.classList.add('show'); clearTimeout(pe.__apT);
          pe.__apT = setTimeout(function(){ pe.classList.remove('show'); }, 6000);
        }
      } catch(e){}
      // Plan 0539 P1.3 — and it goes into the LOG as well as the echo strip. The echo is an 8-second
      // flash; the log is where "which of my lines could the room read?" is answerable a minute later.
      try { chatLogPrivateReceipt(m); } catch(e){}
      try { window.__apPrivate = { ok: !!m.ok, text: m.text || '' }; } catch(e){}   // test hook
      return;
    }
    if (m.t === 'roll' || m.t === 'roll_refused') {
      // Plan 0537 P3.4 — ONE EVENT, TWO REPRESENTATIONS. This renders the HUMAN one, and the server
      // hands it over already rendered (`m.line`) so the prose exists in exactly one place. ⛔ The
      // structured record lives in the `rolls` store slice; anything that needs the numbers reads
      // THAT. Nothing may ever parse this string back into a total — that is how one event quietly
      // becomes two disagreeing facts.
      // ⛔ Same siting rule as chat_private above: NOT in the else-if chain below, which the server
      // deletes when voice is off. Dice are not voice.
      try {
        var re = document.getElementById('ap-echo');
        if (re) {
          re.textContent = (m.t === 'roll') ? String(m.line || '')

  // ---- SPEAK (server {t:'speak'} ← MCP presenter_speak, Plan 0491 §10 minimum working slice) -------
  // On-device speechSynthesis: no audio ever crosses the network. Four traps (§2.3), all silent

  //  1. localService MUST be preferred — the OPSEC guarantee; a remote ("Google …") voice would

  // remains selectable, so a ChromeOS voice-pack update can never silently mute the lane.
  // Generic quality-marker substrings, not device-specific voice names (Plan 0492 §3.1 — C1 waived).
  var AP_VOICE_QUALITY_HIGH = ['natural', 'neural', 'enhanced', 'premium', 'wavenet', 'siri'];
  var AP_VOICE_QUALITY_LOW  = ['espeak', 'mbrola', 'festival', 'pico', 'flite'];

  var AP_VOICE_ACCENTS = { 'en-ie': 4, 'en-gb': 3, 'en-au': 2, 'en-nz': 2 };

  // guess from the name. It is the last and weakest term — it orders, it never gates.
  var AP_FEMALE_VOICE_NAMES = ['female', 'fiona', 'moira', 'karen', 'serena', 'kate', 'samantha',

  function apVoiceMatches(name, list){
    for (var i = 0; i < list.length; i++) { if (name.indexOf(list[i]) !== -1) return true; }
    return false;
  }

  // Quality outranks accent deliberately — an eSpeak Irish voice is still the thin voice we are
  // escaping. Pure function of the voice object: no randomness, no clock, no external state.
  function apVoiceRank(v){
    var name = (v.name || '').toLowerCase();
    var lang = (v.lang || '').toLowerCase().replace('_', '-');
    var quality = 1;                                             // unknown names score mid
    if (apVoiceMatches(name, AP_VOICE_QUALITY_HIGH)) quality = 2;
    else if (apVoiceMatches(name, AP_VOICE_QUALITY_LOW)) quality = 0;
    var accent = AP_VOICE_ACCENTS[lang] || (lang.indexOf('en') === 0 ? 1 : 0);
    var female = apVoiceMatches(name, AP_FEMALE_VOICE_NAMES) ? 1 : 0;
    return (quality * 100) + (accent * 10) + female;

    var voices = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
    if (!voices.length) return;   // still unresolved; voiceschanged will retry

    // path below — including the empty-set branch — can reach a localService === false voice.
    var local = voices.filter(function(v){ return v.localService === true; });
    if (!local.length) {
      apSpeakVoice = null;
      console.warn('[ap-speak] no local (on-device) voice available — refusing to use a remote voice (Plan 0491 §2.3 trap 1)');
      return;
    }
    // Array.prototype.sort is stable, so equal-ranked voices keep enumeration order: same list in,
    // same voice out.
    apSpeakVoice = local.slice().sort(function(a, b){ return apVoiceRank(b) - apVoiceRank(a); })[0];

  // ---- CHIME (server {t:'chime'} ← MCP presenter_bell / presenter_verify_watching) ----------------
  // The human keeps this tab in the background while the AI builds a deck; a gentle
  // audible cue + tab-title flash + on-screen pill says "deck is ready, come look".
  // WebAudio keeps running in a backgrounded tab, but autoplay policy needs the

        for (var i = 0; i < seatReg.length; i++) { if (seatReg[i] && seatReg[i].stationUid === uid) { st = seatReg[i]; break; } }
      }

      // stale behind. A blank badge is worse than no badge: it reads as a broken seat.
      if (!st) { seatEl.style.display = 'none'; seatEl.removeAttribute('title'); if (seatK) seatK.textContent = ''; if (seatV) seatV.textContent = ''; return; }
      var text = (st.icon ? st.icon + ' ' : '') + st.stationLabel;
      if (seatK) seatK.textContent = seatKey || '';

      seatEl.style.display = '';
    }
    window.__apOnStationWelcome = function(m){
      var row = document.getElementById('cfg-station-row');
      var nameRow = document.getElementById('cfg-name-row');
      var reg = m && m.stationRegistry;
      // P13: the ambient badge reads from the SAME relay as the selector, so the two can never
      // disagree about where this seat is, and both vanish together on a stationless deployment.
      seatReg = (Array.isArray(reg) && reg.length) ? reg : null;
      seatKey = (m && typeof m.stationSelectorLabel === 'string') ? m.stationSelectorLabel : '';
      if (!Array.isArray(reg) || !reg.length || !selEl) { if (row) row.style.display = 'none'; if (nameRow) nameRow.style.display = 'none'; paintSeat(null); return; }
      if (row) row.style.display = '';
      if (nameRow) { nameRow.style.display = ''; document.getElementById('cfg-name').textContent = identity.userName || 'NAME UNKNOWN'; }
      var lab = document.getElementById('cfg-station-label');
      if (lab && typeof m.stationSelectorLabel === 'string') lab.textContent = m.stationSelectorLabel;
      selEl.innerHTML = '';
      var groups = {}, order = [];
      reg.slice().sort(function(a,b){ return (a.sortOrder||0) - (b.sortOrder||0); }).forEach(function(st){
        var g = st.group || '';
        if (!groups[g]) { groups[g] = []; order.push(g); }
        groups[g].push(st);
      });
      order.forEach(function(g){
        var parent = selEl;
        if (g) { parent = document.createElement('optgroup'); parent.label = g; selEl.appendChild(parent); }
        groups[g].forEach(function(st){
          var o = document.createElement('option');
          o.value = String(st.stationUid);
          o.textContent = (st.icon ? st.icon + ' ' : '') + st.stationLabel;
          parent.appendChild(o);
        });
      });
      if (m.stationUid != null) selEl.value = String(m.stationUid);
      paintSeat(m.stationUid != null ? m.stationUid : null);   // P13 — ambient, on the welcome
      // The spotlight grant rides the welcome too, so a reconnect restores the Share control
      // instead of hiding it until the GM happens to re-grant (0508 D1).
      var shareRow = document.getElementById('cfg-share-row');
      if (shareRow) shareRow.style.display = m.spotlightGranted ? '' : 'none';
    };
    // Server replies / grant notices land here (dispatched from the ws handler below).
    window.__apOnStation = function(m){
      if (typeof m.granted === 'boolean') {
        var row = document.getElementById('cfg-share-row');
        if (row) row.style.display = m.granted ? '' : 'none';
        stSay(m.granted ? 'you can share your screen with the table' : '', false);
        return;
      }
      if (m.ok && m.stationUid != null) {
        if (selEl) selEl.value = String(m.stationUid);
        // P13 — the badge FOLLOWS the seat. Every station change lands here, whichever surface
        // drove it (the selector, or stationSet from the API/MCP), so the ambient label can never
        // fossilise at whatever the welcome happened to say.
        paintSeat(m.stationUid);
