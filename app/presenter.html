        return;
      }
      if (m.ok) { if (m.defaulted) return; stSay('shared with ' + (m.shared || 0) + ' screens'); return; }
      stSay({ 'no-station': 'nothing has been sent to your seat yet',
              'no-stations': 'this session has no stations',
              'not-granted': 'sharing is not enabled for your seat',
              'too-fast': 'wait a moment before sharing again' }[m.reason] || 'unavailable', true);
    };
    // ---- Plan 0534 W4c: PEEK — the participant calls up a shared screen themselves ------------
    // W4b built {t:'peek', surfaceUid} / {t:'unpeek'} and no control could send either, so the
    // verb existed only for a raw websocket client. Everything below is CLIENT state: the server
    // deliberately keeps none (peek is stateless so the room can always overwrite it), which is
    // precisely why this page has to say when it is peeking — see __apRoomPushed at the end.
    var sfSel = document.getElementById('cfg-surface-select');
    var sfRow = document.getElementById('cfg-surface-row');
    var sfBackRow = document.getElementById('cfg-surface-back-row');
    var peekEl = document.getElementById('ap-peek');
    var peekV = document.getElementById('ap-peek-v');
    var sfReg = null;         // the PEEKABLE surfaces the welcome relayed — the ONLY source of a label
    var peekUid = null;       // what this viewer is peeking at right now, or null for "the room"
    var peekPending = 0;      // >0 while a peek/unpeek we sent has not been answered yet
    function sfLabel(uid){
      if (!Array.isArray(sfReg) || uid == null) return null;
      for (var i = 0; i < sfReg.length; i++) if (sfReg[i] && sfReg[i].surfaceUid === uid) return sfReg[i].surfaceLabel;
      return null;
    }
    // ONE painter for all three renderings — badge, Back row, picker — so they cannot disagree
    // about whether this viewer is on a surface or on the room. A uid with no label in the
    // registry paints as "the room" rather than as a blank badge (the paintSeat rule).
    function paintPeek(){
      var label = sfLabel(peekUid);
      if (label == null) peekUid = null;
      if (peekEl) {
        if (peekUid == null) peekEl.classList.remove('show');
        else { if (peekV) peekV.textContent = label; peekEl.classList.add('show'); }
      }
      if (sfBackRow) sfBackRow.style.display = (peekUid == null) ? 'none' : '';
      if (sfSel) sfSel.value = (peekUid == null) ? '' : String(peekUid);
    }
    function sendPeek(uid){ if (ws && ws.readyState === 1) { peekPending++; ws.send(JSON.stringify({ t:'peek', surfaceUid: uid })); } }
    function sendUnpeek(){ if (ws && ws.readyState === 1) { peekPending++; ws.send(JSON.stringify({ t:'unpeek' })); } }
    if (sfSel) sfSel.addEventListener('change', function(){
      var v = sfSel.value;
      if (!v) { sendUnpeek(); return; }           // choosing the placeholder row IS "go back"
      sendPeek(parseInt(v, 10));                  // canon §3 — an INTEGER uid reaches the wire
    });
    var sfBack = document.getElementById('cfg-surface-back');
    if (sfBack) sfBack.addEventListener('click', function(e){ e.stopPropagation(); sendUnpeek(); });
    // The badge is the return path a viewer can find without opening Settings at all.
    if (peekEl) peekEl.addEventListener('click', function(e){ e.stopPropagation(); sendUnpeek(); });
    window.__apOnSurfaceWelcome = function(m){
      var reg = m && m.surfaceRegistry;
      // DEFAULT-DENY, mirrored client-side: only `peekable === true` is offered. Listing a surface
      // this viewer would be refused by name is a control that lies.
      var peekable = Array.isArray(reg) ? reg.filter(function(s){ return s && s.peekable === true; }) : [];
      sfReg = peekable.length ? peekable : null;
      peekUid = null;                             // a (re)connect lands on the room: no peek survives it
      if (!sfReg || !sfSel) { if (sfRow) sfRow.style.display = 'none'; paintPeek(); return; }
      if (sfRow) sfRow.style.display = '';
      sfSel.innerHTML = '';
      var ph = document.createElement('option'); ph.value = ''; ph.textContent = '▤ Shared screens…';
      sfSel.appendChild(ph);
      var groups = {}, order = [];
      sfReg.slice().sort(function(a,b){ return (a.sortOrder||0) - (b.sortOrder||0); }).forEach(function(sf){
        var g = sf.group || '';
        if (!groups[g]) { groups[g] = []; order.push(g); }
        groups[g].push(sf);
      });
      order.forEach(function(g){
        var parent = sfSel;
        if (g) { parent = document.createElement('optgroup'); parent.label = g; sfSel.appendChild(parent); }
        groups[g].forEach(function(sf){
          var o = document.createElement('option');
          o.value = String(sf.surfaceUid);
          o.textContent = (sf.icon ? sf.icon + ' ' : '') + sf.surfaceLabel;
          parent.appendChild(o);
        });
      });
      paintPeek();
    };
    window.__apOnSurface = function(m){
      if (peekPending > 0) peekPending--;
      if (m.ok && m.unpeeked) { peekUid = null; paintPeek();
        stSay(m.restored ? 'back to what the room is showing' : 'the room has nothing on your screen'); return; }
      if (m.ok) { peekUid = (typeof m.surfaceUid === 'number') ? m.surfaceUid : null; paintPeek();
        stSay(m.hasScreen === false ? 'that screen has nothing on it yet' : 'only you can see this'); return; }
      paintPeek();          // a refusal changed nothing — put the picker back on the truth
      stSay({ 'no-surfaces': 'this session has no shared screens',
              'no-such-surface': 'that screen is not in this session',
              'not-peekable': 'that screen is not open to viewers',
              'not-a-uid': 'unavailable' }[m.reason] || 'unavailable', true);
    };
    // ⚠ THE ROOM WINS (server.mjs peekTo). A push from the presenter overwrites a peek on this
    // socket and the server sends NO notice that it did, so the badge would otherwise go on
    // claiming a surface the viewer can no longer see — a state indicator that lies is worse than
    // none. Any content/clear that is not the answer to a peek we just sent means the room is back.
    window.__apRoomPushed = function(){
      if (peekPending > 0 || peekUid == null) return;
      peekUid = null; paintPeek(); stSay('the presenter changed what is on your screen');
    };
    if (attEl) attEl.addEventListener('click', function(e){ e.stopPropagation(); });   // don't let clicks bubble to the config click-away closer
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && attEl.classList.contains('open')) closeAttendance(); });
  })();

  // P3: bottom chat input — always present, enabled only when a listener is attached.
  function sendOp(path, verb, value){ if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t:'op', path:path, verb:verb, value:value, opId: identity.userId + ':' + Date.now() })); }
  // Plan 0537 P4.2 — the input is CONDITIONAL, not unbuilt, and the old copy did not say so. "chat
  // (disabled until a listener is attached)" names the code's condition; a facilitator reading it
  // cannot tell whether the feature exists, whether they broke it, or what to do next — Bruce read
  // it as "not yet enabled". The replacement names the CAUSE and the ACTION, and lives in a line
  // above the box rather than in placeholder text that vanishes the moment anyone types.
  function updateChat(n){
    var en = (n|0) > 0;
    var i = document.getElementById('ap-chat-input'), b = document.getElementById('ap-chat-send'),
        w = document.getElementById('ap-chat-why'), tab = document.getElementById('ap-chat-tab');
    // ⚠ No dice NOTATION in user-visible page text — t0532-04's register list matches `\d*d(4|6|…)`
    // and an example like "2d6" trips it. Name the commands, not their syntax.
    if (i){ i.disabled = !en; i.placeholder = en ? 'type a message…  ·  /gm private  ·  /roll' : 'nobody is listening yet'; }
    if (b) b.disabled = !en;
    if (w){ w.textContent = en ? '' : '⚠ Messages are off because nobody is listening yet. They turn on by themselves as soon as the facilitator (or an assistant) joins the session — nothing is broken and there is nothing to switch on.'; w.style.display = en ? 'none' : ''; }
    if (tab) tab.title = en ? 'Open the message panel' : 'Message panel — nobody is listening yet';
  }
  (function(){
    // P4.1 — summon/dismiss. ESC closes, so the panel never becomes something you are stuck in.
    var tab = document.getElementById('ap-chat-tab'), panel = document.getElementById('ap-chat');
    if (!tab || !panel) return;
    function setOpen(open){
      panel.classList.toggle('open', open);
      tab.setAttribute('aria-expanded', open ? 'true' : 'false');
      tab.textContent = open ? 'CLOSE' : 'MESSAGE';
      // ⚠ The panel is at right:0 and outranks the tab, so when open it SAT ON TOP of the control
      // that opened it: the tab was unclickable and ESC was the only way out. Slide the tab clear
      // by the panel's MEASURED width — the panel is 320px or 78vw, whichever is smaller, so a
      // hardcoded offset would be wrong on a narrow screen. Seen in a screenshot, not reasoned about.
      tab.style.right = open ? (Math.round(panel.getBoundingClientRect().width) + 'px') : '';
      if (open) { var i = document.getElementById('ap-chat-input'); if (i && !i.disabled) i.focus(); }
    }
    tab.addEventListener('click', function(e){ e.stopPropagation(); setOpen(!panel.classList.contains('open')); });
    panel.addEventListener('click', function(e){ e.stopPropagation(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && panel.classList.contains('open')) setOpen(false); });
    window.__apChatPanel = { open: function(){ return panel.classList.contains('open'); }, set: setOpen };   // test hook
  })();
  // Plan 0472: typed text is FIRST-CLASS input — a {t:'chat'} message the server lands in the unified
  // inbox with the connection's server-authoritative identity (and dual-writes the display slice).
  function sendChat(text){ if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t:'chat', text: text, id: identity.userId + '-' + Date.now() })); }
  (function(){ var b = document.getElementById('ap-chat-send'), i = document.getElementById('ap-chat-input');
    function go(){ var v = i.value; if (!v || i.disabled) return; sendChat(v); i.value = ''; }
    b.addEventListener('click', go);
    i.addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
  })();
  window.__apChat = { enabled: function(){ return !document.getElementById('ap-chat-input').disabled; } };

  /* ═════════════ Plan 0539 P1 — THE READER ═══════════════════════════════════════════════════
   *
   * ⛓ HOW THIS CAME TO BE MISSING, because the lesson is sharper than the bug. Plan 0537 asked what
   * READS the `chat` slice, as a safety check before widening its read permission. The answer was
   * "no component renders chat at all", and that was taken to mean "nothing will break". It equally
   * meant "there is nowhere to read chat" — and the permission shipped without a reader. A probe
   * that says nothing consumes X is also telling you something SHOULD.
   *
   * ── WHERE THE LINES COME FROM (P1.4, decided and stated) ──────────────────────────────────────
   * FOUR sources, all of them STRUCTURED STORE RECORDS or a server receipt. ⛔ Nothing here parses
   * prose, and in particular the roll rows do NOT read the pre-rendered `m.line` string — they read
   * the `rolls` slice, which is the machine-readable representation. `rollLine` is for humans.
   *
   *   `chat/<id>`        the room's talk        — world-readable since 0537 P2.1
   *   `gm/asides/<id>`   private asides         — controller-only by default-deny; a participant
   *                                               NEVER receives these, which is the point
   *   {t:'chat_private'} the sender's receipt   — the ONLY way the sender of an aside can see their
   *                                               own line, since they cannot read `gm`
   *   `rolls/<id>`       the roll log           — ⭐ P1.4: YES, rolls appear in the reader. 0537 kept
   *                                               `/roll` out of the CHAT SLICE and that stays true;
   *                                               this is one reader over several slices, not one
   *                                               slice with two meanings. A roll everyone made in
   *                                               the room but nobody can scroll back to is half a
   *                                               feature, and the P1.7 breakdown needs somewhere
   *                                               durable to live — an 8-second echo flash is not it.
   *
   * ── ⚠ P1.5 — EVERY STRING BELOW IS UNTRUSTED, AND NOTHING UPSTREAM FENCES IT FOR A BROWSER ────
   * `emitInbox` stamps `trust` and the agent paths call `annotateTrust`; both of those fence the text
   * FOR THE AGENT'S INSTRUCTION CHANNEL. Neither is an HTML escape, and neither ran on this path.
   * Worse, as of 0537 this text reaches EVERY PARTICIPANT rather than only the facilitator, so the
   * blast radius of one missed escape is the whole room. ⛔ THIS RENDERER TOUCHES `innerHTML`
   * NOWHERE. Every user-supplied string reaches the DOM through `textContent` and nothing else.
   * Proven by t0539-p1 with a hostile string, in a real browser, screenshotted.
   */
  var CHAT_LOG_MAX = 300;                 // bounded: the store's own collection cap is 1000
  var chatEntries = Object.create(null);  // id -> {id, kind, ts, name, userId, text, roll}
  var chatRowEls = Object.create(null);   // id -> the rendered element (kept, so <details> state survives)

  function chatLogEl(){ return document.getElementById('ap-chat-log'); }

  /** Ingest one path→value pair out of a diff (or a snapshot walk). Returns true if it was ours. */
  function chatIngestPath(pth, val){
    var parts = String(pth).split('/').filter(Boolean);
    if (parts[0] === 'chat'){
      if (parts.length === 1) { chatDropKind('say'); if (val && typeof val === 'object') chatIngestCollection(val, 'say'); return true; }
      if (parts.length === 2) { return chatPut('say', parts[1], val); }
      return false;
    }
    if (parts[0] === 'gm' && parts[1] === 'asides'){
      if (parts.length === 2) { chatDropKind('aside'); if (val && typeof val === 'object') chatIngestCollection(val, 'aside'); return true; }
      if (parts.length === 3) { return chatPut('aside', parts[2], val); }
      return false;
    }
    if (parts[0] === 'rolls'){
      if (parts.length === 1) { chatDropKind('roll'); if (val && typeof val === 'object') chatIngestCollection(val, 'roll'); return true; }
      if (parts.length === 2) { return chatPut('roll', parts[1], val); }
      return false;
    }
    return false;
  }
  function chatIngestCollection(obj, kind){
    for (var k in obj){ if (Object.prototype.hasOwnProperty.call(obj, k)) chatPut(kind, k, obj[k]); }
  }
  function chatDropKind(kind){
    for (var id in chatEntries){ if (chatEntries[id] && chatEntries[id].kind === kind) chatRemove(id); }
  }

  /** Upsert one record. `val === null` is a removal (eviction by the store's collection cap). */
  function chatPut(kind, id, val){
    if (val === null || val === undefined) { chatRemove(kind + ':' + id); return true; }
    if (typeof val !== 'object') return true;
    var key = kind + ':' + id;
    var e;
    if (kind === 'roll'){
      e = { id: key, kind: 'roll', ts: Number(val.ts) || 0, name: val.whoName || val.who || '', userId: val.who || null, text: '', roll: val };
    } else {
      e = { id: key, kind: kind, ts: Number(val.ts) || 0, name: val.name || val.userId || '', userId: val.userId || null,
            text: typeof val.text === 'string' ? val.text : '', roll: null };
    }
    // An id we have already rendered is the SAME event arriving twice (a controller sees its own
    // aside both as a `gm/asides` diff and as its `chat_private` receipt; X1 can redeliver a diff).
    // Replace the record, but do not paint a second row.
    var had = !!chatEntries[key];
    chatEntries[key] = e;
    if (had) chatRepaint(key); else chatInsert(e);
    return true;
  }
  function chatRemove(key){
    if (!chatEntries[key]) return;
    delete chatEntries[key];
    var el = chatRowEls[key];
    if (el && el.parentNode) el.parentNode.removeChild(el);
    delete chatRowEls[key];
  }

  /* ⛓ P1.1 — AUTO-SCROLL ONLY WHEN ALREADY AT THE BOTTOM. Yanking the view while somebody is
   * reading back through the log is the single most-hated behaviour a chat pane can have: it steals
   * the line you were on and there is no way to ask for it back. Measured BEFORE the insert, applied
   * after — the insert itself changes scrollHeight, so testing afterwards always says "not at the
   * bottom" and the pane would never follow at all. */
  function chatAtBottom(log){ return (log.scrollHeight - log.scrollTop - log.clientHeight) < 24; }

  function chatInsert(e){
    var log = chatLogEl(); if (!log) return;
    var stick = chatAtBottom(log);
    var empty = log.querySelector('.ap-cl-empty'); if (empty) log.removeChild(empty);
    var el = chatRow(e);
    chatRowEls[e.id] = el;
    // Insert by timestamp. Almost always an append; the walk exists because a snapshot replays a
    // keyed OBJECT whose iteration order is not a history, and a resync can interleave slices.
    var n = log.lastElementChild;
    while (n && (n.__apTs || 0) > e.ts) n = n.previousElementSibling;
    if (n) { if (n.nextSibling) log.insertBefore(el, n.nextSibling); else log.appendChild(el); }
    else log.insertBefore(el, log.firstChild);
    while (log.children.length > CHAT_LOG_MAX && log.firstElementChild){
      var drop = log.firstElementChild; if (drop.__apId) delete chatRowEls[drop.__apId];
      log.removeChild(drop);
    }
    if (stick) log.scrollTop = log.scrollHeight;
  }
  function chatRepaint(key){
    var old = chatRowEls[key], e = chatEntries[key];
    if (!old || !old.parentNode || !e) return;
    var log = chatLogEl(); var stick = log ? chatAtBottom(log) : false;
    var el = chatRow(e);
    old.parentNode.replaceChild(el, old);
    chatRowEls[key] = el;
    if (log && stick) log.scrollTop = log.scrollHeight;
  }

  /** Build one row. ⛔ textContent ONLY — see the P1.5 note above. */
  function chatRow(e){
    var row = document.createElement('div');
    row.className = 'ap-cl-row ' + e.kind + (e.userId && e.userId === identity.userId ? ' mine' : '');
    row.__apTs = e.ts; row.__apId = e.id;
    var who = document.createElement('span');
    who.className = 'ap-cl-who';
    who.textContent = e.name || 'someone';
    row.appendChild(who);
    if (e.kind === 'aside'){
      // ⚠ "facilitator", never the uppercase prose form of the role — this is user-visible page text
      // and the 0532 neutral-register guard scans it.
      var tag = document.createElement('span');
      tag.className = 'ap-cl-tag';
      tag.textContent = '🔒 private to the facilitator — ';
      row.appendChild(tag);
    }
    if (e.kind === 'roll' && e.roll && window.ArgusBreakdown){
      row.appendChild(window.ArgusBreakdown.render(rollBreakdown(e.roll), { summary: rollSummary(e.roll) }));
    } else {
      var txt = document.createElement('span');
      txt.className = 'ap-cl-txt';
      txt.textContent = e.text;
      row.appendChild(txt);
    }
    return row;
  }

  /* P1.7 — the ONLY dice-aware code in the reader: a 6-line adapter from the roll RECORD onto the
   * generic breakdown model. The renderer itself (lib/breakdown.js) knows nothing about dice, so the
   * station-skill work of roadmap 0541 reuses it by writing an adapter of its own — not a second
   * format. ⛔ Read from the record's fields; never from `line`. */
  function rollBreakdown(r){
    return {
      label: r.label || null,
      parts: Array.isArray(r.rolls) ? r.rolls : [],
      partsLabel: r.entry === 'manual' ? 'entered by hand' : 'generated',
      modifiers: Array.isArray(r.modifiers) ? r.modifiers : [],
      total: r.total,
      note: (r.target === null || r.target === undefined) ? null
          : ('vs ' + r.target + '+  —  ' + (r.success ? 'SUCCESS' : 'FAILURE'))
    };
  }
  function rollSummary(r){
    return '🎲 ' + (r.label ? r.label + ' ' : '') + String(r.spec || '') + ' = ' + r.total
         + ((r.target === null || r.target === undefined) ? '' : ('  vs ' + r.target + '+  ' + (r.success ? 'SUCCESS' : 'FAILURE')));
  }

  /** A whole snapshot: rebuild from scratch (a snapshot REPLACES state, it does not amend it). */
  function chatLogSnapshot(state){
    var log = chatLogEl();
    chatEntries = Object.create(null); chatRowEls = Object.create(null);
    if (log) log.textContent = '';
    if (state && typeof state === 'object'){
      if (state.chat && typeof state.chat === 'object') chatIngestCollection(state.chat, 'say');
      if (state.gm && state.gm.asides && typeof state.gm.asides === 'object') chatIngestCollection(state.gm.asides, 'aside');
      if (state.rolls && typeof state.rolls === 'object') chatIngestCollection(state.rolls, 'roll');
    }
    chatLogPlaceholder();
    if (log) log.scrollTop = log.scrollHeight;
  }
  function chatLogDiff(diff){
    if (!diff) return;
    for (var pth in diff){ if (Object.prototype.hasOwnProperty.call(diff, pth)) chatIngestPath(pth, diff[pth]); }
    chatLogPlaceholder();
  }
  /* An EMPTY log must say it is empty. A blank rectangle is the "is this built?" failure P4.2 was
   * written to fix, one panel over. */
  function chatLogPlaceholder(){
    var log = chatLogEl(); if (!log) return;
    var has = log.querySelector('.ap-cl-row');
    var ph = log.querySelector('.ap-cl-empty');
    if (has && ph) log.removeChild(ph);
    else if (!has && !ph){
      var d = document.createElement('div'); d.className = 'ap-cl-empty';
      d.textContent = 'nothing said yet — messages from the room appear here';
      log.appendChild(d);
    }
  }
  /** The sender's own aside, from the server's receipt — their only source for it. */
  function chatLogPrivateReceipt(m){
    if (!m || !m.ok || !m.id) return;
    chatPut('aside', m.id, { id: m.id, text: m.text || '', name: m.name || identity.userName, userId: identity.userId, ts: Number(m.ts) || Date.now() });
    chatLogPlaceholder();
  }
  (function(){
    if (window.ArgusBreakdown) window.ArgusBreakdown.injectCss(document);
    chatLogPlaceholder();
    // Test hook: the log as TEXT plus its structure, so a probe can assert what a human would read
    // without reaching into markup. `html` is exposed ONLY so the escaping test can prove no element
    // was created from a message — ⛔ nothing in the product reads it.
    window.__apChatLog = {
      text: function(){ var l = chatLogEl(); return l ? l.textContent : ''; },
      rows: function(){ var l = chatLogEl(); return l ? [].map.call(l.querySelectorAll('.ap-cl-row'), function(r){
              return { kind: r.className.replace('ap-cl-row','').trim(), text: r.textContent }; }) : []; },
      html: function(){ var l = chatLogEl(); return l ? l.innerHTML : ''; },
      atBottom: function(){ var l = chatLogEl(); return l ? chatAtBottom(l) : true; },
      scrollTop: function(){ var l = chatLogEl(); return l ? l.scrollTop : 0; }
    };
  })();

  // X3: report client render errors to the telemetry sink.
  window.addEventListener('error', function(){ try { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t:'telemetry', kind:'render-error' })); } catch(e){} });

  // Relay bridge messages from the sandboxed component up to the server.
  // Ops (op protocol) go up as {t:'op'}; everything else as {t:'result'}.
  // (Diffs/snapshots flow DOWN via the m.t==='host'/'snapshot' handlers above.)
  window.addEventListener('message', function(e){
    var d = e.data;
    if (!d || d.source !== NS) return;
    if (frame && e.source !== frame.contentWindow) return;   // only our iframe
    if (ws.readyState !== 1) return;
    if (d.type === 'op') ws.send(JSON.stringify({ t:'op', path:d.path, verb:d.verb, value:d.value, opId:d.opId }));
    // Plan 0584 C1 — A COMPONENT MAY ASK FOR ITS OWN SEAT TO BE RE-SHOWN. This is core's own
    // `station-show` verb, and it is SELF-SCOPED AND UNGATED by core's own argument (server.mjs,
    // "the six messages that put something on a screen"): it shows you only what is already yours,
    // so a participant may always call it and it can never reach anybody else's display. The ⟲/▣
    // buttons in the config panel already send exactly this frame; the only new thing is that the
    // component which just changed WHICH SEAT YOU HAVE can ask for the redraw itself, instead of
    // leaving a player looking at the board of a ship they are no longer on until they remember to
    // press a button. ⛔ Deliberately NOT `station-select` (which WRITES a seat) and NOT
    // `station-share` (which reaches the room) — neither is self-scoped in the same way.
    // ⛔ It is relayed rather than passed through as a `result`, because it is a request to the
    // HOST about this viewer's own display, not an answer to be broadcast to controllers.
    else if (d.type === 'station-show') ws.send(JSON.stringify({ t:'station-show' }));
    else ws.send(JSON.stringify({ t:'result', msg: d }));
  });

  // ---- Config Panel (Plan 0438 Group B, POC): click the green connectivity dot → settings overlay.
  // Two working controls (zoom + high-contrast, both transform the live display) + a connection readout.
  (function(){
    var STORE = NS + ':cfg';
    var cfg = { scale: 1, contrast: false };
    try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch(e){}
    var panel = document.getElementById('ap-config');
    var btn = document.getElementById('led-btn');
    function apply(){
      stage.style.setProperty('--ap-scale', cfg.scale);
      stage.style.setProperty('--ap-filter', cfg.contrast ? 'contrast(1.25) brightness(1.08)' : 'none');
      [].forEach.call(panel.querySelectorAll('[data-scale]'), function(b){ b.classList.toggle('sel', parseFloat(b.getAttribute('data-scale')) === cfg.scale); });
      var cb = document.getElementById('cfg-contrast'); cb.textContent = 'High-contrast: ' + (cfg.contrast ? 'on' : 'off'); cb.classList.toggle('sel', cfg.contrast);
      try { localStorage.setItem(STORE, JSON.stringify(cfg)); } catch(e){}
    }
    function readout(){
      document.getElementById('cfg-readout').innerHTML =
        '<span class="k">server</span> ' + location.host + '<br>' +
        '<span class="k">you</span> ' + identity.userName + ' (' + identity.userId + ')<br>' +
        '<span class="k">role</span> ' + identity.role + ' · <span class="k">link</span> ' + (ws && ws.readyState === 1 ? 'connected' : 'offline');
    }
    function toggle(open){ var show = (open === undefined) ? !panel.classList.contains('open') : open; panel.classList.toggle('open', show); if (show) readout(); }
    btn.addEventListener('click', function(e){ e.stopPropagation(); toggle(); });
    panel.addEventListener('click', function(e){ e.stopPropagation(); });
    document.addEventListener('click', function(){ toggle(false); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') toggle(false); });
    [].forEach.call(panel.querySelectorAll('[data-scale]'), function(b){ b.addEventListener('click', function(){ cfg.scale = parseFloat(b.getAttribute('data-scale')); apply(); }); });
    document.getElementById('cfg-contrast').addEventListener('click', function(){ cfg.contrast = !cfg.contrast; apply(); });
    document.getElementById('cfg-close').addEventListener('click', function(){ toggle(false); });

    /* AP-VOICE:BEGIN */
    // Plan 0470 (RT-27): voice on/off row. Default OFF. ON => APVoice.enable() (mic prompt);
    // Tier-1 loads + capture start ONLY on grant. Deny/error => revert to OFF + inline message.
    // The transient on-air badge + one-click stop (RT-9) is the ONLY voice affordance outside here.
    // Plan 0473 P0: stripped server-side when PRESENTER_VOICE_ENABLED is off (the row it binds is gone too).
    (function(){
      var vbtn = document.getElementById('cfg-voice-toggle');
      var vmsg = document.getElementById('cfg-voice-msg');
      if (!vbtn) return;
      function paint(){ var on = !!(window.APVoice && window.APVoice.enabled); vbtn.textContent = '🎙 Mic: ' + (on ? 'on' : 'off'); vbtn.setAttribute('aria-pressed', on ? 'true' : 'false'); vbtn.classList.toggle('sel', on); if (!on) vbtn.disabled = false; }
      window.__apVoicePaint = paint;   // let server-initiated enable()/stop refresh this row
      vbtn.addEventListener('click', function(e){
        e.stopPropagation(); vmsg.textContent = '';
        // Plan 0491 §2.3 trap 4: prime speechSynthesis on THIS gesture — iOS requires a user
        // gesture before the first utterance; a zero-length one unlocks the queue for later real speech.
        try { if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch(err){}
        if (window.APVoice && window.APVoice.enabled) { try { window.APVoice.disable(); } catch(err){} paint(); return; }
        vbtn.disabled = true; vbtn.textContent = '🎙 Mic: requesting…';
        Promise.resolve().then(function(){ return window.APVoice && window.APVoice.enable(); })
          .then(function(){ vbtn.disabled = false; paint(); })
          .catch(function(err){ vbtn.disabled = false; paint(); vmsg.textContent = String(err && err.message || err); });
      });
      paint();
    })();
    /* AP-VOICE:END */

    // ---- Role picker (P4): become presenter/user without editing the URL.
    // Reflects identity.role in the .sel classes; on change persists to localStorage
    // and re-establishes the socket so a FRESH hello carries the new role (and token,
    // which satisfies the AUTH-1 gate when a control token is configured server-side).
    var roleUserBtn = document.getElementById('cfg-role-user');
    var rolePresBtn = document.getElementById('cfg-role-presenter');
    var controlRow = document.getElementById('cfg-control-row');
    function reflectRole(){
      roleUserBtn.classList.toggle('sel', identity.role !== 'presenter');
      rolePresBtn.classList.toggle('sel', identity.role === 'presenter');
      // Only a presenter has a control panel; participants get no button.
      var isPres = identity.role === 'presenter';
      controlRow.style.display = isPres ? '' : 'none';
      var ocb = document.getElementById('cfg-open-control'); if (ocb) ocb.disabled = !isPres;
      updateGotoControl();   // P2.8: quick-switch button tracks role changes too
    }
    function setRole(role){
      if (role === identity.role) return;
      identity.role = role;
      try { localStorage.setItem(ROLE_KEY, role); } catch(e){}
      reflectRole(); renderWho(); readout();
      // Reconnect: onclose -> scheduleReconnect -> connect() re-sends hello w/ new role.
      if (ws && (ws.readyState === 0 || ws.readyState === 1)) { try { ws.close(); } catch(e){} }
      else { connect(); }
    }
    // ---- AUTH-ROLE (P5.5): inline password gate on the Presenter switch.
    // When the server is gated, clicking Presenter reveals a password field instead of
    // switching immediately. On Unlock we send the typed word, then — if the server does not
    // promote us — retry with sha256(seed+password), which is what a rolePassword server wants.
    // (crypto.subtle needs a secure context: localhost/https qualify; plain-LAN-http is out
    // of scope for this gate — deployers front it with https or a tunnel.)
    var pwGroup = document.getElementById('cfg-role-pwgroup');
    var pwInput = document.getElementById('cfg-role-pw');
    var pwMsg = document.getElementById('cfg-role-msg');
    var attempting = null;   // the role we're waiting for the server to CONFIRM via welcome
    function showPwGroup(show){ pwGroup.style.display = show ? '' : 'none'; if (show){ pwMsg.textContent = ''; try { pwInput.focus(); } catch(e){} } }
    async function computeHash(pw){
      var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(authSeed + pw));
      return [].map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    }
    var pendingPw = null;
    async function unlock(){
      var pw = pwInput.value || '';
      /*
       * TISSUE-THIN GATE (deliberate, pre-OAuth): the typed word IS the token on a `controlToken`
       * deployment, sent as-is and compared literally. Keep-honest-people-honest, nothing more.
       *
       * ⚠ BUT a `rolePassword` deployment compares sha256(seed+password), which a literal can
       * never match — so the literal alone made the gate UNREACHABLE there, and silently: a
       * correct password just said "wrong password". (The comment above this function had claimed
       * hashing for months while the code sent plaintext, and computeHash sat here unused.)
       * ⇒ literal first, hashed retry second. See onWelcomeRole below.
       */
      identity.token = pw;
      pendingPw = pw;
      attempting = 'presenter';
      // setRole short-circuits if role is unchanged; force through when already presenter-attempt.
      if (identity.role === 'presenter') { if (ws && (ws.readyState===0||ws.readyState===1)){ try{ws.close();}catch(e){} } else connect(); }
      else setRole('presenter');
    }
    roleUserBtn.addEventListener('click', function(){ attempting = null; identity.token = null; pwMsg.textContent = ''; showPwGroup(false); setRole('participant'); });
    rolePresBtn.addEventListener('click', function(){
      if (!authGated) { attempting = 'presenter'; setRole('presenter'); }   // ungated → immediate (P4 behavior)
      else { showPwGroup(true); }                                            // gated → reveal pw field, don't switch yet
    });
    document.getElementById('cfg-role-go').addEventListener('click', function(){ unlock(); });
    pwInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') unlock(); });

    // The server echoes the EFFECTIVE granted role in `welcome`. Sync identity.role to it and,
    // if we were attempting Presenter, translate a silent downgrade into visible feedback.
    onWelcomeRole = function(effRole){
      if (typeof effRole !== 'string') return;
      var wasAttempting = attempting;
      identity.role = effRole;
      try { localStorage.setItem(ROLE_KEY, effRole === 'presenter' ? 'presenter' : 'participant'); } catch(e){}
      if (wasAttempting === 'presenter'){
        if (effRole === 'presenter'){                                                                    // granted
          attempting = null; pendingPw = null;
          showPwGroup(false); pwInput.value = ''; pwMsg.textContent = '';
        } else if (pendingPw !== null && authSeed) {                                                     // ⭐ hashed retry
          var pw2 = pendingPw; pendingPw = null;      // one retry only, never a loop
          pwMsg.textContent = 'unlocking…';
          computeHash(pw2).then(function(h){
            identity.token = h;
            // ⛔ THE ROLE MUST BE RE-ASSERTED TOO. A valid token alone changes nothing: the hello
            // carries role AND token, and the server grants presenter only when the hello ASKS
            // for it. Setting just the token sent a correct credential alongside a request to
            // stay a participant, and the server — correctly — kept us one.
            identity.role = 'presenter';
            if (ws && (ws.readyState===0||ws.readyState===1)){ try{ws.close();}catch(e){} } else connect();
          });
          return;                                     // stay `attempting` across the reconnect
        } else {                                                                                         // denied
          attempting = null; pendingPw = null;
          pwMsg.textContent = 'wrong password'; identity.token = null;
        }
      }
      reflectRole(); renderWho(); readout();
    };
    reflectRole();

    // ---- Presenter-control expand/collapse (P5). The control overlay hosts the
    // SAME-ORIGIN /control page in a NON-sandboxed iframe (its ws/fetch resolve to
    // 'self' → allowed by CSP frame-src/connect-src 'self'). Expanding "grows" from
    // the Config panel; closing SHRINKS BACK to it. The base display socket is never
    // touched. The iframe is created on open and REMOVED on close, so control.html's
    // ws + rAF stop and no phantom child browsing context lingers (cf. MON-2).
    var controlOverlay = document.getElementById('ap-control-overlay');
    function openControl(){
      var url = '/control?role=presenter';
      if (identity.token) url += '&token=' + encodeURIComponent(identity.token);
      // Create the iframe lazily (NO sandbox → same-origin → its ws/fetch resolve to
      // 'self' and pass CSP). Existing only while expanded means the idle display page
      // has no phantom child frame.
      var f = document.getElementById('ap-control-frame');
      if (!f) { f = document.createElement('iframe'); f.id = 'ap-control-frame'; f.setAttribute('name', 'ap-control-frame'); f.setAttribute('title', 'Presenter Control'); controlOverlay.appendChild(f); }
      f.setAttribute('src', url);
      controlOverlay.classList.add('open');
      toggle(false);   // close Config so the overlay visually expands from it
    }
    function closeControl(){
      controlOverlay.classList.remove('open');
      // Remove the iframe entirely: tears down control.html's ws + rAF AND drops the
      // child browsing context (cf. MON-2 — no hidden-but-live leak).
      var f = document.getElementById('ap-control-frame');
      if (f) f.remove();
      toggle(true);    // shrink back to the Config panel
    }
    document.getElementById('cfg-open-control').addEventListener('click', function(e){ e.stopPropagation(); openControl(); });
    document.getElementById('ap-control-close').addEventListener('click', function(e){ e.stopPropagation(); closeControl(); });

    apply();
    window.__apConfig = {
      role: function(){ return identity.role; },   // EFFECTIVE (welcome-confirmed) role
      open: function(){ return panel.classList.contains('open'); },
      gated: function(){ return authGated; },
      get: function(){ return cfg; }
    };
    window.__apControl = {
      open: function(){ return controlOverlay.classList.contains('open'); },
      frameSrc: function(){ var f = document.getElementById('ap-control-frame'); return (f && f.getAttribute('src')) || ''; }
    };
  })();
})();
</script>
</body>
</html>
